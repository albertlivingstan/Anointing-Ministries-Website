<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anointing Ministries · Offline</title><style>body{margin:0;background:#101827;color:#faf8f3;font:17px/1.9 system-ui;padding:10vw}img{width:70px;border-radius:50%}h1{font:42px Georgia}button,select{padding:12px;background:#faf8f3;color:#101827;border:0;border-radius:6px}article{max-width:900px}p{line-height:2}</style><img src="/icons/icon-192.png" alt="Anointing Ministries"><h1>A quiet moment in His Word.</h1><p>You’re offline. Open a Bible book you have previously read in this app.</p><select id="books" aria-label="Downloaded Bible books"><option>Select a downloaded book</option></select><article id="verses"></article><p><a style="color:#c9a76a" href="/">Reconnect to the ministry</a></p><script>const select=document.querySelector('#books');caches.open('anointing-v3').then(async c=>{for(const r of await c.keys()){if(/\/bible\/(en|ta)-\d+\.json/.test(r.url)){const b=await(await c.match(r)).json();const o=document.createElement('option');o.value=r.url;o.textContent=b.name;select.append(o)}}});select.onchange=async()=>{const r=await caches.match(select.value);if(!r)return;const b=await r.json();const root=document.querySelector('#verses');root.replaceChildren();for(const ch of b.chapters){const h=document.createElement('h2');h.textContent=b.name+' '+ch.n;root.append(h);for(const v of ch.verses){const p=document.createElement('p');p.textContent=v.n+'. '+v.text;root.append(p)}}}</script></html>
